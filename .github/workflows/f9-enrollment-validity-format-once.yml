name: F9 enrollment validity format once

on:
  push:
    paths:
      - ".github/workflows/f9-enrollment-validity-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9-uat-enrollment-validity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format enrollment validity files
        run: >-
          npx prettier --write
          app/admin/productos/[productId]/page.tsx
          app/admin/productos/actions.ts
          app/admin/productos/page.tsx
          app/admin/productos/product-form-fields.tsx
          docs/f9-enrollment-validity.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/productos/[productId]/page.tsx app/admin/productos/actions.ts app/admin/productos/page.tsx app/admin/productos/product-form-fields.tsx docs/f9-enrollment-validity.md
          git commit -m "Format enrollment validity changes"
          git push origin HEAD:f9-uat-enrollment-validity
