name: Demi format transfer test once

on:
  push:
    branches:
      - release/demi-production-candidate

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/demi-production-candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/demi-bank-transfer-flow-contract.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/demi-bank-transfer-flow-contract.test.ts
          git commit -m "style(demi): format transfer contract"
          git push origin HEAD:release/demi-production-candidate
