name: Temporary Flow 01 Prettier

on:
  push:
    branches:
      - feat/flow-01-alta-completa-alumna
    paths:
      - "app/admin/alumnas/**"
      - ".github/workflows/tmp-flow01-prettier.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-01-alta-completa-alumna
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format Flow 01 files
        run: |
          npx prettier --write             "app/admin/alumnas/[studentId]/alta/StudentOnboardingForm.tsx"             "app/admin/alumnas/[studentId]/page.tsx"             "app/admin/alumnas/page.tsx"             "app/admin/alumnas/StudentFormErrorDialog.tsx"
          rm ".github/workflows/tmp-flow01-prettier.yml"

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Flow 01 UAT changes" || exit 0
          git push origin HEAD:feat/flow-01-alta-completa-alumna
