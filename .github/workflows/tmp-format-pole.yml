name: Temporary Pole Formatter

on:
  push:
    branches:
      - feat/catalogo-figuras-pole-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format and emit
        run: |
          npx prettier "app/admin/agenda/[sessionId]/PoleClassComboClient.tsx" --write
          echo "FORMATTED_FILE_BEGIN"
          base64 -w 0 "app/admin/agenda/[sessionId]/PoleClassComboClient.tsx"
          echo
          echo "FORMATTED_FILE_END"
