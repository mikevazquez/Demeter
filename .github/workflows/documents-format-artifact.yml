name: Documents format artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/documentos/**"
      - "app/student/documentos/**"
      - "app/responsable/documentos/**"
      - "lib/documents.ts"
      - "supabase/functions/upload-studio-document/index.ts"
      - ".github/workflows/documents-format-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format DOCUMENTOS-01 files
        run: |
          npx prettier --write             "app/admin/documentos/**/*.tsx"             "app/admin/documentos/actions.ts"             "app/responsable/documentos/**/*.tsx"             "app/responsable/documentos/actions.ts"             "app/student/documentos/**/*.tsx"             "app/student/documentos/actions.ts"             "lib/documents.ts"             "supabase/functions/upload-studio-document/index.ts"
      - uses: actions/upload-artifact@v4
        with:
          name: documentos-prettier
          if-no-files-found: error
          path: |
            app/admin/documentos
            app/responsable/documentos
            app/student/documentos
            lib/documents.ts
            supabase/functions/upload-studio-document/index.ts
