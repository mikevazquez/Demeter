name: Format resource defaults

on:
  push:
    branches:
      - feat/activity-resource-defaults

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/activity-resource-defaults
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            'app/admin/actividades/[activityId]/page.tsx' \
            app/admin/actividades/actions.ts \
            app/admin/actividades/actividades.css \
            app/admin/actividades/ActivityWizard.tsx \
            app/admin/actividades/nueva/page.tsx \
            'app/admin/agenda/[sessionId]/recursos/actions.ts' \
            'app/admin/agenda/[sessionId]/recursos/page.tsx' \
            tests/recursos-01-activity-inheritance.test.ts \
            tests/recursos-01-session-config.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'app/admin/actividades/[activityId]/page.tsx' \
            app/admin/actividades/actions.ts \
            app/admin/actividades/actividades.css \
            app/admin/actividades/ActivityWizard.tsx \
            app/admin/actividades/nueva/page.tsx \
            'app/admin/agenda/[sessionId]/recursos/actions.ts' \
            'app/admin/agenda/[sessionId]/recursos/page.tsx' \
            tests/recursos-01-activity-inheritance.test.ts \
            tests/recursos-01-session-config.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "Format activity resource defaults"
            git push origin HEAD:feat/activity-resource-defaults
          fi
