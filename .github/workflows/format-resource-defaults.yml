name: Format resource defaults

on:
  push:
    branches:
      - feat/activity-resource-defaults

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write             app/admin/actividades/[activityId]/page.tsx             app/admin/actividades/actions.ts             app/admin/actividades/actividades.css             app/admin/actividades/ActivityWizard.tsx             app/admin/actividades/nueva/page.tsx             app/admin/agenda/[sessionId]/recursos/actions.ts             app/admin/agenda/[sessionId]/recursos/page.tsx             tests/recursos-01-activity-inheritance.test.ts             tests/recursos-01-session-config.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-resource-defaults
          path: |
            app/admin/actividades/[activityId]/page.tsx
            app/admin/actividades/actions.ts
            app/admin/actividades/actividades.css
            app/admin/actividades/ActivityWizard.tsx
            app/admin/actividades/nueva/page.tsx
            app/admin/agenda/[sessionId]/recursos/actions.ts
            app/admin/agenda/[sessionId]/recursos/page.tsx
            tests/recursos-01-activity-inheritance.test.ts
            tests/recursos-01-session-config.test.ts
