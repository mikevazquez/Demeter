name: RETOS branch format

on:
  push:
    branches:
      - feat/retos-01

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/retos-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format RETOS files
        run: >
          npx prettier --write
          app/admin/recompensas/RuleEditorForm.tsx
          'app/admin/retos/[ruleId]/page.tsx'
          app/student/actions.ts
          app/student/paquete/page.tsx
          app/student/reservar/quick-book-button.tsx
          'app/student/retos/[ruleId]/page.tsx'
          app/student/retos/actions.ts
          app/student/retos/page.tsx
          tests/retos01-challenges.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/admin/recompensas/RuleEditorForm.tsx             'app/admin/retos/[ruleId]/page.tsx'             app/student/actions.ts             app/student/paquete/page.tsx             app/student/reservar/quick-book-button.tsx             'app/student/retos/[ruleId]/page.tsx'             app/student/retos/actions.ts             app/student/retos/page.tsx             tests/retos01-challenges.test.ts
          git commit -m "chore(retos): format branch"
          git push origin HEAD:feat/retos-01
