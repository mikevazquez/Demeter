name: Temp format evaluaciones

on:
  push:
    branches:
      - feat/evaluaciones-01-sync
    paths:
      - .github/workflows/format-evaluaciones-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluaciones-01-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/evaluaciones/v2/[id]/EvaluationAspectRow.tsx" "app/admin/evaluaciones/v2/[id]/page.tsx"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/admin/evaluaciones/v2/[id]/EvaluationAspectRow.tsx" "app/admin/evaluaciones/v2/[id]/page.tsx"
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "chore: format simplified evaluation editor"
            git push origin HEAD:feat/evaluaciones-01-sync
          fi
