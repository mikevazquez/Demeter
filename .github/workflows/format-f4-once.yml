name: Format F4 once

on:
  push:
    paths:
      - ".github/workflows/format-f4-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/instructores/[instructorId]/page.tsx" app/admin/instructores/actions.ts app/admin/instructores/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/instructores
          git diff --cached --quiet || git commit -m "Format F4 instructor UI"
          git push origin HEAD:main
