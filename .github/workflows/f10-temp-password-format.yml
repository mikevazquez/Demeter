name: F10 Temp Password Format

on:
  push:
    branches:
      - f10-temp-password-ux-hotfix

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f10-temp-password-ux-hotfix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/alumnas/[studentId]/StudentAccessProvisioner.tsx" "supabase/functions/provision-student-access/index.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/admin/alumnas/[studentId]/StudentAccessProvisioner.tsx" "supabase/functions/provision-student-access/index.ts"
          git commit -m "style(f10): format temporary password hotfix"
          git push origin HEAD:f10-temp-password-ux-hotfix
