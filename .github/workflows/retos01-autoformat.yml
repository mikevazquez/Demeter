name: RETOS-01 Autoformat
# Temporary branch-only formatter; removed after formatting.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format RETOS-01 files
        run: |
          npx prettier --write \
            app/admin/recompensas/actions.ts \
            app/admin/recompensas/RuleEditorForm.tsx \
            app/admin/retos/page.tsx \
            app/student/retos/page.tsx \
            'app/student/retos/[ruleId]/page.tsx' \
            tests/retos01-challenges.test.ts
      - name: Commit formatting
        run: |
          git config user.name "studio-flow-ci"
          git config user.email "studio-flow-ci@users.noreply.github.com"
          git add app/admin/recompensas/actions.ts app/admin/recompensas/RuleEditorForm.tsx app/admin/retos/page.tsx app/student/retos/page.tsx 'app/student/retos/[ruleId]/page.tsx' tests/retos01-challenges.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format RETOS-01"
          git push origin HEAD:${{ github.head_ref }}
