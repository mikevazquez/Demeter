name: F11 format fix

on:
  push:
    branches:
      - infra/sandbox-staging-f11

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier config
        run: >-
          npx prettier --write
          app/coach/actions.ts
          'app/coach/clases/[sessionId]/roster/page.tsx'
          'app/coach/clases/[sessionId]/walk-in/walk-in-form.tsx'
          'app/coach/clases/[sessionId]/walk-in/page.tsx'
          'app/coach/clases/[sessionId]/resumen/page.tsx'
          'app/coach/clases/[sessionId]/finalizada/page.tsx'
          tests/f11-coach-walkin-finalize-contract.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/coach/actions.ts 'app/coach/clases/[sessionId]/roster/page.tsx' 'app/coach/clases/[sessionId]/walk-in/walk-in-form.tsx' 'app/coach/clases/[sessionId]/walk-in/page.tsx' 'app/coach/clases/[sessionId]/resumen/page.tsx' 'app/coach/clases/[sessionId]/finalizada/page.tsx' tests/f11-coach-walkin-finalize-contract.test.ts
          git commit -m "chore(f11): format walk-in and finalization flow"
          git push origin HEAD:infra/sandbox-staging-f11
