name: EVALUACIONES format repair

on:
  push:
    branches:
      - feat/evaluaciones-01-sync

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluaciones-01-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/alumnas/[studentId]/StudentEvaluationsPanel.tsx"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "EVALUACIONES-01 · format Perfil 360 evaluations"
          git push origin HEAD:feat/evaluaciones-01-sync
