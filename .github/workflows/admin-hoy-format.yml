name: ADMIN Hoy Format

on:
  push:
    branches: [admin-hoy-repair]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-hoy-repair
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/page.tsx" "app/admin/agenda/[sessionId]/page.tsx" "app/admin/hoy/SessionOperations.tsx" "app/admin/hoy.css" "tests/admin-ux-02-visual-parity.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "studio-flow-ci"
          git config user.email "actions@users.noreply.github.com"
          git add "app/admin/page.tsx" "app/admin/agenda/[sessionId]/page.tsx" "app/admin/hoy/SessionOperations.tsx" "app/admin/hoy.css" "tests/admin-ux-02-visual-parity.test.ts"
          git commit -m "Format ADMIN Hoy repair"
          git push origin HEAD:admin-hoy-repair
