name: F8 formatter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/actions.ts app/admin/hoy/SessionOperations.tsx supabase/migrations/20260915190000_f8_attendance_core.sql supabase/migrations/20260915193000_f8_minimal_walkin.sql
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/actions.ts app/admin/hoy/SessionOperations.tsx supabase/migrations/20260915190000_f8_attendance_core.sql supabase/migrations/20260915193000_f8_minimal_walkin.sql
          git commit -m "Format F8 implementation"
          git push
