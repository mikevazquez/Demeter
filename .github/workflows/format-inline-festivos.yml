name: Format inline festivos

on:
  push:
    branches:
      - feat/festivos-01

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/festivos-01
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/configuracion/festivos/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/configuracion/festivos/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format inline FESTIVOS configuration"
            git push origin HEAD:feat/festivos-01
          fi
