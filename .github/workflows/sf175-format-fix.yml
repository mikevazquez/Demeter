name: SF175 Format Fix

on:
  push:
    branches:
      - feat/sf-175-reservation-confirmed
    paths:
      - ".github/workflows/sf175-format-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format SF-175 test
        run: npx prettier --write tests/sf175-reservation-confirmed.test.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/sf175-reservation-confirmed.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Prettier to SF-175 auth test"
            git push origin HEAD:feat/sf-175-reservation-confirmed
          fi
