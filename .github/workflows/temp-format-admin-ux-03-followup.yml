name: TEMP Format ADMIN-UX-03 Followup

on:
  push:
    branches:
      - admin-ux-03-agenda-calendar

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-ux-03-agenda-calendar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/agenda/page.tsx app/admin/agenda/configuracion/page.tsx app/admin/agenda/agenda-calendar.css tests/admin-ux-03-agenda-calendar.test.ts tests/admin-ux-02-navigation.test.ts
      - run: npm run format:check
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/agenda/page.tsx app/admin/agenda/configuracion/page.tsx app/admin/agenda/agenda-calendar.css tests/admin-ux-03-agenda-calendar.test.ts tests/admin-ux-02-navigation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: format ADMIN-UX-03 follow-up"
            git push origin HEAD:admin-ux-03-agenda-calendar
          fi
