name: SF240 temporary formatter

on:
  push:
    branches:
      - feat/sf-240-rewards-student-portal

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sf-240-rewards-student-portal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format SF-240
        run: npx prettier --write app/student/StudentNav.tsx app/student/recompensas lib/student/rewards.ts tests/sf240-rewards-student-portal.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- app/student/StudentNav.tsx app/student/recompensas lib/student/rewards.ts tests/sf240-rewards-student-portal.test.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/student/StudentNav.tsx app/student/recompensas lib/student/rewards.ts tests/sf240-rewards-student-portal.test.ts
          git commit -m "style: format SF-240 student Rewards portal"
          git push origin HEAD:feat/sf-240-rewards-student-portal
