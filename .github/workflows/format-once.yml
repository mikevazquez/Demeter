name: Format once

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/hoy.css app/admin/hoy/SessionOperations.tsx app/admin/page.tsx app/admin/actions.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/hoy.css app/admin/hoy/SessionOperations.tsx app/admin/page.tsx app/admin/actions.ts
          git commit -m "Format F7 Today operations"
          git push origin main
