name: Format ACTIVIDADES and RECURSOS

on:
  push:
    branches:
      - feat/recursos-01

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recursos-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: |
          npx prettier --write             app/admin/actividades/actions.ts             app/admin/actividades/actividades.css             app/admin/actividades/ActivityWizard.tsx             app/admin/actividades/page.tsx             app/admin/configuracion/recursos/page.tsx             app/admin/configuracion/recursos/recursos.module.css             tests/actividades-01-restored.test.ts             tests/recursos-01-activity-inheritance.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/admin/actividades/actions.ts             app/admin/actividades/actividades.css             app/admin/actividades/ActivityWizard.tsx             app/admin/actividades/page.tsx             app/admin/configuracion/recursos/page.tsx             app/admin/configuracion/recursos/recursos.module.css             tests/actividades-01-restored.test.ts             tests/recursos-01-activity-inheritance.test.ts
          git commit -m "Format ACTIVIDADES and RECURSOS"
          git push origin HEAD:feat/recursos-01
