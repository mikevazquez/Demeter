name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format RETOS files for cleanup
        shell: bash
        run: |
          files=(
            "app/admin/recompensas/RuleEditorForm.tsx"
            "app/admin/retos/[ruleId]/page.tsx"
            "app/student/actions.ts"
            "app/student/paquete/page.tsx"
            "app/student/reservar/quick-book-button.tsx"
            "app/student/retos/[ruleId]/page.tsx"
            "app/student/retos/actions.ts"
            "app/student/retos/page.tsx"
            "tests/retos01-challenges.test.ts"
          )
          npx prettier --write "${files[@]}"
          echo "__RETOS_FORMAT_BEGIN__"
          for file in "${files[@]}"; do
            echo "__FILE_BEGIN__${file}"
            base64 -w0 "$file"
            echo
            echo "__FILE_END__${file}"
          done
          echo "__RETOS_FORMAT_END__"

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
