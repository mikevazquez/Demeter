name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format UX-07 diagnostics
        run: |
          npx prettier --write app/student/movimientos/page.tsx tests/sf-n14-portal-ux07-movements.test.ts
          echo "MOVEMENTS_BASE64_BEGIN"
          base64 -w0 app/student/movimientos/page.tsx
          echo
          echo "MOVEMENTS_BASE64_END"
          echo "TEST_BASE64_BEGIN"
          base64 -w0 tests/sf-n14-portal-ux07-movements.test.ts
          echo
          echo "TEST_BASE64_END"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
