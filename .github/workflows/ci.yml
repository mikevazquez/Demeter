name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format H01 diagnostics
        run: |
          npx prettier --write app/admin/agenda/page.tsx app/admin/agenda/recurring-actions.ts app/admin/page.tsx app/student/perfil/page.tsx tests/sf-n14-profile-avatar-activity-colors.test.ts
          for f in app/admin/agenda/page.tsx app/admin/agenda/recurring-actions.ts app/admin/page.tsx app/student/perfil/page.tsx tests/sf-n14-profile-avatar-activity-colors.test.ts; do
            key=$(echo "$f" | tr '/.-' '___')
            echo "${key}_BASE64_BEGIN"
            base64 -w0 "$f"
            echo
            echo "${key}_BASE64_END"
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
