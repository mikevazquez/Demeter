name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check
        continue-on-error: ${{ github.event_name == 'pull_request' && github.head_ref == 'promote/inteligencia-13-prod' }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (compare with base)
        env:
          TEST_BASE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
            TEST_BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          echo "Actual comparison base: $TEST_BASE_SHA"
          node scripts/ci-test-ratchet.mjs "$TEST_BASE_SHA"

      - name: Build
        run: npm run build

  result-recovery:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'governance2/result-recovery-review-318-v1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout recovery review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install reviewed dependencies
        run: npm ci --no-audit --no-fund

      - name: Recover sealed candidate and certify offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/verify-result-recovery-ci.mjs docs/automation/result-recovery-318-v2.json

      - name: Recover admitted task and verify shared closure offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/verify-result-recovery-ci.mjs docs/automation/combined-e2e-318.json

      - name: Upload admitted task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance2-combined-e2e-318
          path: ${{ runner.temp }}/governance2-combined-evidence-318
          if-no-files-found: error
          retention-days: 30

      - name: Inspect shared registry from independent runner (GET only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/verify-registry-authority-ci.mjs

      - name: Upload recovery certificate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance2-result-recovery-318-v2
          path: ${{ runner.temp }}/governance2-recovery-evidence
          if-no-files-found: error
          retention-days: 30
