name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Show Prettier changes for migration guard
        run: |
          npx prettier --write scripts/check-migration-grants.mjs scripts/check-migration-grants.test.mjs
          git diff -- scripts/check-migration-grants.mjs scripts/check-migration-grants.test.mjs
          exit 1

      - name: Format check
        run: npm run format:check

      - name: Governance policy and migration grant tests
        run: node --test scripts/governance-policy-checks.mjs scripts/check-migration-grants.test.mjs

      - name: Reject dangerous table grants in changed migrations
        env:
          MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migration-grants.mjs "$MIGRATION_BASE_SHA"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (compare with base)
        env:
          TEST_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-test-ratchet.mjs "$TEST_BASE_SHA"

      - name: Build
        run: npm run build
