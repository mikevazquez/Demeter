name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: |
          npx prettier --write \
            'app/admin/agenda/[sessionId]/recursos/page.tsx' \
            'app/admin/agenda/[sessionId]/recursos/session-resources.module.css' \
            tests/recursos-01-activity-inheritance.test.ts
          for file in \
            'app/admin/agenda/[sessionId]/recursos/page.tsx' \
            'app/admin/agenda/[sessionId]/recursos/session-resources.module.css' \
            tests/recursos-01-activity-inheritance.test.ts
          do
            echo "FORMAT_FILE:$file"
            base64 -w0 "$file"
            echo
          done
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
