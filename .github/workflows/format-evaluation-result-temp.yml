name: Temp format evaluation result UX

on:
  push:
    branches:
      - feat/evaluaciones-01-sync
    paths:
      - .github/workflows/format-evaluation-result-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluaciones-01-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/student/page.tsx" "app/student/evaluaciones/page.tsx" "app/student/evaluaciones/resultado/[evaluationId]/page.tsx" "tests/evaluaciones01-operational-flow.test.ts"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/student/page.tsx" "app/student/evaluaciones/page.tsx" "app/student/evaluaciones/resultado/[evaluationId]/page.tsx" "tests/evaluaciones01-operational-flow.test.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "chore: format evaluation result UX"
            git push origin HEAD:feat/evaluaciones-01-sync
          fi
