name: SF239 temporary formatter

on:
  push:
    branches:
      - feat/sf-239-rewards-admin-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sf-239-rewards-admin-ui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format Rewards UI
        run: npx prettier --write app/admin/recompensas

      - name: Commit formatting
        run: |
          if git diff --quiet -- app/admin/recompensas; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/recompensas
          git commit -m "style: format SF-239 rewards admin UI"
          git push origin HEAD:feat/sf-239-rewards-admin-ui
