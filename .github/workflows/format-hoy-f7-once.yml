name: Format F7 Today once

on:
  push:
    paths:
      - ".github/workflows/format-hoy-f7-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/actions.ts app/admin/hoy.css app/admin/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/actions.ts app/admin/hoy.css app/admin/page.tsx
          git diff --cached --quiet || git commit -m "Format F7 Today workflow"
          git push
