name: F7 Prettier Fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/f7-prettier-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format F7 files
        run: npx prettier app/admin/actions.ts app/admin/roster-uat.css --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/actions.ts app/admin/roster-uat.css
          git commit -m "Apply exact Prettier formatting for F7"
          git push
