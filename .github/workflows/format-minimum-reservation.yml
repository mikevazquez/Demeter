name: Format minimum reservation branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/minimum-reservation-cancellation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: |
          npx prettier --write \
            app/admin/actividades/actions.ts \
            app/admin/actividades/actividades.css \
            app/admin/actividades/ActivityWizard.tsx \
            app/admin/agenda/session-detail-admin-ux-04.css \
            app/admin/hoy.css \
            app/admin/mis-clases/notificaciones/[notificationId]/page.tsx \
            app/admin/page.tsx \
            app/student/notificaciones/[notificationId]/page.tsx \
            app/student/page.tsx \
            app/student/reservar/[sessionId]/confirmar/page.tsx \
            app/student/reservar/[sessionId]/page.tsx \
            app/student/reservar/page.tsx \
            supabase/functions/process-session-minimum-cancelled/index.ts \
            tests/minimum-reservation-cancellation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format minimum reservation feature"
          git push origin HEAD:${{ github.head_ref }}
