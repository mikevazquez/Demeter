name: SF255 Visual Format

on:
  push:
    branches: [sf-255-rewards-status]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sf-255-rewards-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/student/page.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "studio-flow-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/student/page.tsx
          git commit -m "Format SF-255 visual adjustment"
          git push origin HEAD:sf-255-rewards-status
