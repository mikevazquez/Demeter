name: Continuity lab format diagnostic

on:
  pull_request:
    paths:
      - "scripts/automation/continuity-lab.mjs"
      - "tests/automation/continuity-lab.test.mjs"
      - ".github/workflows/continuity-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  pretty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print formatted sources for correction
        shell: bash
        run: |
          npx prettier --write scripts/automation/continuity-lab.mjs tests/automation/continuity-lab.test.mjs
          echo FORMAT_SCRIPT_BEGIN
          base64 -w0 scripts/automation/continuity-lab.mjs
          echo
          echo FORMAT_SCRIPT_END
          echo FORMAT_TEST_BEGIN
          base64 -w0 tests/automation/continuity-lab.test.mjs
          echo
          echo FORMAT_TEST_END
