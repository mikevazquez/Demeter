name: EVALUACIONES v2 format result

on:
  push:
    branches:
      - feat/evaluaciones-01-sync
    paths:
      - ".github/workflows/evaluaciones-v2-format-result.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluaciones-01-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/student/evaluaciones/resultado/[evaluationId]/page.tsx"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "studio-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "app/student/evaluaciones/resultado/[evaluationId]/page.tsx"
          git commit -m "style: format student evaluation result [skip ci]"
          git push origin HEAD:feat/evaluaciones-01-sync
