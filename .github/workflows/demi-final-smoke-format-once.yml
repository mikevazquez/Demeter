name: Demi final smoke format once

on:
  push:
    branches:
      - release/demi-production-candidate

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-final-smoke]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/demi-production-candidate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format final smoke files
        run: |
          npx prettier --write \
            lib/assistant/action-tools.ts \
            lib/assistant/read-tools.ts \
            app/student/mis-clases/[reservationId]/page.tsx \
            tests/demi-approved-uat-contract.test.ts \
            tests/demi-approved-uat-contract.test.ts \
            tests/demi-service-waitlist-runtime.test.ts \
            tests/demi-student-package-status-contract.test.ts \
            tests/student-primary-package-selection.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/assistant/action-tools.ts \
            lib/assistant/read-tools.ts \
            app/student/mis-clases/[reservationId]/page.tsx \
            tests/demi-service-waitlist-runtime.test.ts \
            tests/demi-student-package-status-contract.test.ts \
            tests/student-primary-package-selection.test.ts
          git commit -m "chore: format final smoke files [format-final-smoke]"
          git push origin HEAD:release/demi-production-candidate
