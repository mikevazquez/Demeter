name: SF174 Waitlist Format

on:
  push:
    branches:
      - feat/sf-174-asistian-provider

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write lib/automations/catalog.ts supabase/functions/process-waitlist-promoted/index.ts tests/sf174-waitlist-promoted-asistian.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/automations/catalog.ts supabase/functions/process-waitlist-promoted/index.ts tests/sf174-waitlist-promoted-asistian.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(sf174): format waitlist promoted routing"
          git push origin HEAD:feat/sf-174-asistian-provider
