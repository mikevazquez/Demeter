name: SF242 temporary formatter

on:
  push:
    branches:
      - feat/sf-242-rewards-integrations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sf-242-rewards-integrations

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format SF-242
        run: npx prettier --write lib/student/reward-notices.ts app/student/recompensas/notice-actions.ts app/student/components/RewardUnlockedNotice.tsx app/student/layout.tsx app/admin/alumnas/[studentId]/StudentRewardsSummary.tsx app/admin/alumnas/[studentId]/page.tsx tests/sf242-rewards-integrations.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- lib/student/reward-notices.ts app/student/recompensas/notice-actions.ts app/student/components/RewardUnlockedNotice.tsx app/student/layout.tsx app/admin/alumnas/[studentId]/StudentRewardsSummary.tsx app/admin/alumnas/[studentId]/page.tsx tests/sf242-rewards-integrations.test.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/student/reward-notices.ts app/student/recompensas/notice-actions.ts app/student/components/RewardUnlockedNotice.tsx app/student/layout.tsx app/admin/alumnas/[studentId]/StudentRewardsSummary.tsx app/admin/alumnas/[studentId]/page.tsx tests/sf242-rewards-integrations.test.ts
          git commit -m "style: format SF-242 Rewards integrations"
          git push origin HEAD:feat/sf-242-rewards-integrations
