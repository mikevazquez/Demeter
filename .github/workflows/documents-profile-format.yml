name: Documents profile format helper

on:
  pull_request:
    branches: [main]
    paths:
      - "app/admin/alumnas/[studentId]/actions.ts"
      - "app/admin/alumnas/[studentId]/Profile360Overview.tsx"
      - "app/admin/alumnas/[studentId]/StudentDocumentsPanel.tsx"
      - "lib/documents.ts"
      - "tests/documentos-booking-continuation.test.ts"
      - "tests/documentos-student-profile-placement.test.ts"
      - ".github/workflows/documents-profile-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format profile document files
        run: |
          npx prettier --write \
            "app/admin/alumnas/[studentId]/actions.ts" \
            "app/admin/alumnas/[studentId]/Profile360Overview.tsx" \
            "app/admin/alumnas/[studentId]/StudentDocumentsPanel.tsx" \
            "lib/documents.ts" \
            "tests/documentos-booking-continuation.test.ts" \
            "tests/documentos-student-profile-placement.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "studio-flow-ci"
          git config user.email "studio-flow-ci@users.noreply.github.com"
          git add app/admin/alumnas lib/documents.ts tests/documentos-booking-continuation.test.ts tests/documentos-student-profile-placement.test.ts
          git commit -m "chore(documents): format student profile integration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
