name: SF-N02 Format Snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format SF-N02 files
        run: |
          npx prettier --write \
            "app/admin/alumnas/[studentId]/layout.tsx" \
            "app/admin/alumnas/[studentId]/page.tsx" \
            "app/admin/alumnas/[studentId]/Profile360Overview.tsx" \
            "app/admin/alumnas/[studentId]/StudentPackageCard.tsx" \
            "app/admin/alumnas/[studentId]/StudentPortalAccessSection.tsx" \
            "app/admin/alumnas/page.tsx" \
            "app/admin/alumnas/profile-360.css"

      - name: Upload formatted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sf-n02-formatted-files
          path: |
            app/admin/alumnas/[studentId]/layout.tsx
            app/admin/alumnas/[studentId]/page.tsx
            app/admin/alumnas/[studentId]/Profile360Overview.tsx
            app/admin/alumnas/[studentId]/StudentPackageCard.tsx
            app/admin/alumnas/[studentId]/StudentPortalAccessSection.tsx
            app/admin/alumnas/page.tsx
            app/admin/alumnas/profile-360.css
          if-no-files-found: error
