name: SF-N02 Format Snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format SF-N02 files
        run: |
          npx prettier --write \
            "app/admin/alumnas/[studentId]/layout.tsx" \
            "app/admin/alumnas/[studentId]/page.tsx" \
            "app/admin/alumnas/[studentId]/Profile360Overview.tsx" \
            "app/admin/alumnas/[studentId]/StudentPackageCard.tsx" \
            "app/admin/alumnas/[studentId]/StudentPortalAccessSection.tsx" \
            "app/admin/alumnas/page.tsx" \
            "app/admin/alumnas/profile-360.css"

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "app/admin/alumnas/[studentId]/layout.tsx" \
            "app/admin/alumnas/[studentId]/page.tsx" \
            "app/admin/alumnas/[studentId]/Profile360Overview.tsx" \
            "app/admin/alumnas/[studentId]/StudentPackageCard.tsx" \
            "app/admin/alumnas/[studentId]/StudentPortalAccessSection.tsx" \
            "app/admin/alumnas/page.tsx" \
            "app/admin/alumnas/profile-360.css"
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style(SF-N02): apply Prettier to profile 360"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
