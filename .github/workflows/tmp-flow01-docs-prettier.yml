name: Temporary Flow 01 Docs Prettier

on:
  push:
    branches:
      - feat/flow-01-alta-completa-alumna
    paths:
      - "docs/flow01-uat.md"
      - ".github/workflows/tmp-flow01-docs-prettier.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-01-alta-completa-alumna
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format UAT document
        run: |
          npx prettier --write "docs/flow01-uat.md"
          rm ".github/workflows/tmp-flow01-docs-prettier.yml"

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Flow 01 UAT document" || exit 0
          git push origin HEAD:feat/flow-01-alta-completa-alumna
