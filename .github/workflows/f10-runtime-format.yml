name: F10 Runtime Format

on:
  push:
    branches:
      - f10-provision-runtime-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f10-provision-runtime-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'app/admin/alumnas/[studentId]/actions.ts'
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/admin/alumnas/[studentId]/actions.ts'
          git commit -m 'style(f10): apply prettier to provisioning action'
          git push origin HEAD:f10-provision-runtime-v2
