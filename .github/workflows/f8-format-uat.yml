name: F8 UAT format once

on:
  push:
    paths:
      - ".github/workflows/f8-format-uat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format F8 UAT files
        run: npx prettier --write app/admin/actions.ts app/admin/hoy/SessionOperations.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/actions.ts app/admin/hoy/SessionOperations.tsx
          git commit -m "Apply Prettier formatting for F8 UAT"
          git push origin HEAD:main
