name: V2 Release Format
on:
  push:
    branches:
      - release/studio-flow-v2
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style(v2): format release candidate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/studio-flow-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(v2): format release candidate"
          git push origin HEAD:release/studio-flow-v2
