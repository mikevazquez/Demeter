name: F10 one-shot format

on:
  push:
    branches:
      - f10-uat-home-profile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f10-uat-home-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/student/actions.ts app/student/page.tsx
      - name: Commit formatted files and remove formatter
        run: |
          rm .github/workflows/f10-home-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/student/actions.ts app/student/page.tsx .github/workflows/f10-home-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(f10): format home UAT changes"
          git push origin HEAD:f10-uat-home-profile
