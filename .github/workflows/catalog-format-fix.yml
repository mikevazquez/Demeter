name: Catalog format fix

on:
  push:
    branches:
      - feat/catalogo-figuras-pole-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalogo-figuras-pole-v1
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format catalog files
        run: |
          npx prettier --write \
            app/admin/catalogo/catalogo.module.css \
            app/admin/catalogo/page.tsx \
            app/admin/catalogo/pole-catalog-client.tsx \
            app/admin/catalogo/pole-catalog-data.json

      - name: Commit format-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/catalogo
          git commit -m "chore: format Pole catalog"
          git push origin HEAD:feat/catalogo-figuras-pole-v1
