name: SF175 Format Diagnostic

on:
  push:
    branches:
      - feat/sf-175-reservation-confirmed
    paths:
      - ".github/workflows/sf175-format-diagnostic.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format SF-175 files
        run: |
          npx prettier --write             supabase/functions/process-booking-created/index.ts             supabase/functions/process-booking-created/reservation-confirmed.ts             tests/sf175-reservation-confirmed.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             supabase/functions/process-booking-created/index.ts             supabase/functions/process-booking-created/reservation-confirmed.ts             tests/sf175-reservation-confirmed.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Prettier to SF-175 files"
            git push origin HEAD:feat/sf-175-reservation-confirmed
          fi
