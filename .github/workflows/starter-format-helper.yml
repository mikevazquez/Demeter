name: Starter Format Helper

on:
  push:
    branches:
      - feat/starter-product-eligibility-20261017
    paths:
      - "app/admin/alumnas/page.tsx"
      - "app/admin/productos/product-form-fields.tsx"
      - ".github/workflows/starter-format-helper.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/alumnas/page.tsx app/admin/productos/product-form-fields.tsx
      - run: git diff -- app/admin/alumnas/page.tsx app/admin/productos/product-form-fields.tsx > starter-prettier.patch
      - uses: actions/upload-artifact@v4
        with:
          name: starter-prettier-patch
          path: starter-prettier.patch
