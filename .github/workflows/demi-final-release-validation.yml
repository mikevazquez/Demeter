name: Demi final release validation

on:
  push:
    branches:
      - release/demi-production-candidate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Demi and Asistian regressions
        run: >
          npx vitest run
          tests/demi-*.test.ts
          tests/sf173-messaging-provider.test.ts
          tests/sf174-asistian-provider.test.ts
          tests/sf174-reservation-cancelled-asistian.test.ts
          tests/sf174-waitlist-promoted-asistian.test.ts
          tests/sf174-student-welcome.test.ts
      - run: npm run build
