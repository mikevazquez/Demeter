name: Governance - Autonomous Codex coordinator

on:
  push:
    branches: [chore/governance-autonomous-coordinator-20261015]
    paths:
      - .github/codex-coordinator/**
      - .github/workflows/governance-codex-coordinator.yml
      - scripts/codex-coordinator.mjs
      - tests/automation/**
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

# One coordinator run at a time, including selection, generation and publication.
concurrency:
  group: studio-flow-autonomous-coordinator
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'mikevazquez/Demeter' && github.ref == 'refs/heads/chore/governance-autonomous-coordinator-20261015' && github.actor == 'mikevazquez'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: "Preview – demeterbueno"
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
      has_tasks: ${{ steps.select.outputs.has_tasks }}
      control_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test coordinator controls before selection
        run: node --test tests/automation/coordinator.node.mjs
      - name: Select admitted tasks and skip already published work
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
        run: node scripts/codex-coordinator.mjs select
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coordinator-selection-${{ github.run_attempt }}
          path: /tmp/coordinator-selection.json
          retention-days: 14

  execute:
    needs: select
    if: needs.select.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: ${{ fromJSON(needs.select.outputs.tasks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: "Preview – demeterbueno"
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
      TASK_ID: ${{ matrix.task.id }}
      COORDINATOR_CONFIG: /opt/coordinator-runtime/queue.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Protect verifier and install network-isolation prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          mkdir -p /home/runner/.codex
          sudo mkdir -p /opt/coordinator-runtime
          sudo cp scripts/codex-coordinator.mjs /opt/coordinator-runtime/coordinator.mjs
          sudo cp .github/codex-coordinator/queue.json /opt/coordinator-runtime/queue.json
          sudo chmod -R a-w /opt/coordinator-runtime
      - name: Retrieve and bind work order before generation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
        run: node /opt/coordinator-runtime/coordinator.mjs prepare "$TASK_ID"
      - name: Install baseline dependencies only for admitted code checks
        if: steps.prepare.outputs.needs_deps == 'true'
        run: npm ci --ignore-scripts
      - name: Execute task with Codex
        if: steps.prepare.outputs.recovery != 'true'
        id: attempt1
        continue-on-error: true
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: /tmp/coordinator-prompt.txt
          output-file: /tmp/coordinator-codex.txt
      - name: Validate first attempt
        if: steps.prepare.outputs.recovery != 'true'
        id: verify1
        run: node /opt/coordinator-runtime/coordinator.mjs verify "$TASK_ID" 1
      - name: Repair once using actual verifier feedback
        if: steps.verify1.outputs.valid == 'false' && steps.verify1.outputs.retryable == 'true'
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: /tmp/coordinator-retry.txt
          output-file: /tmp/coordinator-codex-retry.txt
      - name: Validate repair attempt
        if: steps.verify1.outputs.valid == 'false' && steps.verify1.outputs.retryable == 'true'
        run: node /opt/coordinator-runtime/coordinator.mjs verify "$TASK_ID" 2
      - name: Require a validated result
        run: node /opt/coordinator-runtime/coordinator.mjs assert-result
      - name: Retain per-task result and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinator-generated-${{ matrix.task.id }}-${{ github.run_attempt }}
          path: |
            /tmp/coordinator-task.json
            /tmp/coordinator-result.json
            /tmp/coordinator-failure.json
            /tmp/coordinator-codex.txt
            /tmp/coordinator-codex-retry.txt
          retention-days: 14

  certify:
    needs: [select, execute]
    if: always() && needs.select.result == 'success' && needs.select.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coordinator-generated-*-${{ github.run_attempt }}
          path: /tmp/coordinator-generated
      - name: Prepare credential-free independent validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          mkdir -p /home/runner/.codex
          sudo mkdir -p /opt/coordinator-runtime
          sudo cp scripts/codex-coordinator.mjs /opt/coordinator-runtime/coordinator.mjs
          sudo cp .github/codex-coordinator/queue.json /opt/coordinator-runtime/queue.json
          sudo chmod -R a-w /opt/coordinator-runtime
          if node -e 'let q=JSON.parse(require("fs").readFileSync(".github/codex-coordinator/queue.json"));process.exit(q.tasks.some(t=>t.checks.some(c=>c[0]==="npm"))?0:1)'; then npm ci --ignore-scripts; fi
      - name: Revalidate generated files and checks without publication credentials
        env:
          COORDINATOR_CONFIG: /opt/coordinator-runtime/queue.json
        run: node /opt/coordinator-runtime/coordinator.mjs certify /tmp/coordinator-generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinator-certified-${{ github.run_attempt }}
          path: /tmp/coordinator-certified
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [select, certify]
    if: needs.certify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Preview – demeterbueno"
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coordinator-certified-${{ github.run_attempt }}
          path: /tmp/coordinator-certified
      - name: Publish exact admitted files as draft PRs without merge or deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
        run: node scripts/codex-coordinator.mjs publish /tmp/coordinator-certified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coordinator-publication-${{ github.run_attempt }}
          path: /tmp/coordinator-published
          retention-days: 14
