name: Governance - Autonomous Codex coordinator

on:
  push:
    branches: [chore/governance-autonomous-coordinator-20261015]
    paths:
      - .github/codex-coordinator/**
      - .github/workflows/governance-codex-coordinator.yml
      - scripts/codex-coordinator.mjs
      - scripts/governance-shared.mjs
      - scripts/governance-operations.mjs
      - scripts/governance-evaluator.mjs
      - tests/automation/**
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

# One coordinator run at a time, including selection, generation and publication.
concurrency:
  group: studio-flow-autonomous-coordinator
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'mikevazquez/Demeter' && github.ref == 'refs/heads/chore/governance-autonomous-coordinator-20261015' && github.actor == 'mikevazquez'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: "Preview – demeterbueno"
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      tasks: ${{ steps.admit.outputs.tasks }}
      has_tasks: ${{ steps.admit.outputs.has_tasks }}
      control_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test coordinator controls before selection
        run: |
          node --test tests/automation/coordinator.node.mjs
          node --test tests/automation/governance.node.mjs tests/automation/governance-shared.node.mjs tests/automation/governance-failures.node.mjs tests/automation/governance-operations.node.mjs
      - name: Read shared state and apply Governance decision gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/governance-shared.mjs gate
      - name: Select admitted tasks and skip already published work
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
        run: node scripts/codex-coordinator.mjs select
      - name: Intersect selection with the shared Governance gate
        id: admit
        env:
          SELECTED_TASKS: ${{ steps.select.outputs.tasks }}
        run: node scripts/governance-shared.mjs admit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coordinator-selection-${{ github.run_attempt }}
          path: /tmp/coordinator-selection.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: governance-shared-gate-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/governance-shared/gate.json
          retention-days: 14

  reserve-operations:
    needs: select
    if: needs.select.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
    outputs:
      tasks: ${{ steps.reserve.outputs.tasks }}
      has_tasks: ${{ steps.reserve.outputs.has_tasks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Reserve generation stages in the shared journal before execution
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_TASKS: ${{ needs.select.outputs.tasks }}
        run: node scripts/governance-operations.mjs reserve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coordinator-operations-${{ github.run_attempt }}
          path: /tmp/governance-operations/reserve.json
          if-no-files-found: error
          retention-days: 14

  execute:
    needs: [select, reserve-operations]
    if: needs.reserve-operations.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: ${{ fromJSON(needs.reserve-operations.outputs.tasks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: "Preview – demeterbueno"
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
      TASK_ID: ${{ matrix.task.id }}
      COORDINATOR_CONFIG: /opt/coordinator-runtime/queue.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Protect verifier and install network-isolation prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          mkdir -p /home/runner/.codex
          sudo mkdir -p /opt/coordinator-runtime
          sudo cp scripts/codex-coordinator.mjs /opt/coordinator-runtime/coordinator.mjs
          sudo cp .github/codex-coordinator/queue.json /opt/coordinator-runtime/queue.json
          sudo chmod -R a-w /opt/coordinator-runtime
      - name: Retrieve and bind work order before generation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
        run: node /opt/coordinator-runtime/coordinator.mjs prepare "$TASK_ID"
      - name: Install baseline dependencies only for admitted code checks
        if: steps.prepare.outputs.needs_deps == 'true'
        run: npm ci --ignore-scripts
      - name: Check durable generation reservation before stage 1
        if: steps.prepare.outputs.recovery != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION_STAGE: 1
        run: node scripts/governance-operations.mjs check
      - name: Execute task with Codex
        if: steps.prepare.outputs.recovery != 'true'
        id: attempt1
        continue-on-error: true
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: /tmp/coordinator-prompt.txt
          output-file: /tmp/coordinator-codex.txt
      - name: Validate first attempt
        if: steps.prepare.outputs.recovery != 'true'
        id: verify1
        run: node /opt/coordinator-runtime/coordinator.mjs verify "$TASK_ID" 1
      - name: Require a completed or explicitly repairable first attempt
        run: node /opt/coordinator-runtime/coordinator.mjs assert-attempt
      - name: Retain per-task result and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinator-generated-${{ matrix.task.id }}-${{ github.run_attempt }}
          path: |
            /tmp/coordinator-task.json
            /tmp/coordinator-result.json
            /tmp/coordinator-failure.json
            /tmp/coordinator-candidate.json
            /tmp/coordinator-codex.txt
            /tmp/coordinator-codex-retry.txt
          retention-days: 14

  repair:
    needs: [select, reserve-operations, execute]
    if: always() && needs.select.result == 'success' && needs.reserve-operations.result == 'success' && needs.reserve-operations.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        task: ${{ fromJSON(needs.reserve-operations.outputs.tasks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: "Preview – demeterbueno"
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
      TASK_ID: ${{ matrix.task.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coordinator-generated-${{ matrix.task.id }}-${{ github.run_attempt }}
          path: /tmp/coordinator-first-attempt
      - name: Restore only admitted repairable work from first attempt
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
        run: node scripts/codex-coordinator.mjs prepare-repair "$TASK_ID" /tmp/coordinator-first-attempt
      - name: Prepare fresh isolated retry runner
        if: steps.repair.outputs.repair_needed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          mkdir -p /home/runner/.codex
          sudo mkdir -p /opt/coordinator-runtime
          sudo cp scripts/codex-coordinator.mjs /opt/coordinator-runtime/coordinator.mjs
          sudo cp .github/codex-coordinator/queue.json /opt/coordinator-runtime/queue.json
          sudo chmod -R a-w /opt/coordinator-runtime
      - name: Install baseline dependencies for repair checks
        if: steps.repair.outputs.repair_needed == 'true' && steps.repair.outputs.needs_deps == 'true'
        run: npm ci --ignore-scripts
      - name: Check durable generation reservation before stage 2
        if: steps.repair.outputs.repair_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION_STAGE: 2
        run: node scripts/governance-operations.mjs check
      - name: Repair once using actual verifier feedback on a fresh runner
        if: steps.repair.outputs.repair_needed == 'true'
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        continue-on-error: true
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: /tmp/coordinator-retry.txt
          output-file: /tmp/coordinator-codex-retry.txt
      - name: Validate the final bounded attempt
        if: steps.repair.outputs.repair_needed == 'true'
        env:
          COORDINATOR_CONFIG: /opt/coordinator-runtime/queue.json
        run: |
          node /opt/coordinator-runtime/coordinator.mjs verify "$TASK_ID" 2
          node /opt/coordinator-runtime/coordinator.mjs assert-result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coordinator-repaired-${{ matrix.task.id }}-${{ github.run_attempt }}
          path: |
            /tmp/coordinator-result.json
            /tmp/coordinator-failure.json
            /tmp/coordinator-codex-retry.txt
          retention-days: 14

  certify:
    needs: [select, reserve-operations, execute, repair]
    if: always() && needs.select.result == 'success' && needs.reserve-operations.result == 'success' && needs.reserve-operations.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coordinator-*-${{ github.run_attempt }}
          path: /tmp/coordinator-generated
      - name: Prepare credential-free independent validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then sudo sysctl -w kernel.unprivileged_userns_clone=1; fi
          mkdir -p /home/runner/.codex
          sudo mkdir -p /opt/coordinator-runtime
          sudo cp scripts/codex-coordinator.mjs /opt/coordinator-runtime/coordinator.mjs
          sudo cp .github/codex-coordinator/queue.json /opt/coordinator-runtime/queue.json
          sudo chmod -R a-w /opt/coordinator-runtime
          if node -e 'let q=JSON.parse(require("fs").readFileSync(".github/codex-coordinator/queue.json"));process.exit(q.tasks.some(t=>t.checks.some(c=>c[0]==="npm"))?0:1)'; then npm ci --ignore-scripts; fi
      - name: Revalidate generated files and checks without publication credentials
        env:
          COORDINATOR_CONFIG: /opt/coordinator-runtime/queue.json
        run: node /opt/coordinator-runtime/coordinator.mjs certify /tmp/coordinator-generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinator-certified-${{ github.run_attempt }}
          path: /tmp/coordinator-certified
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [select, certify]
    if: always() && needs.select.result == 'success' && needs.certify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Preview – demeterbueno"
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      CONTROL_SHA: ${{ needs.select.outputs.control_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.select.outputs.control_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coordinator-certified-${{ github.run_attempt }}
          path: /tmp/coordinator-certified
      - name: Publish exact admitted files as draft PRs without merge or deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_NOTION_TOKEN: ${{ secrets.CODEX_NOTION_TOKEN }}
        run: node scripts/codex-coordinator.mjs publish /tmp/coordinator-certified
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coordinator-publication-${{ github.run_attempt }}
          path: /tmp/coordinator-published
          retention-days: 14

  report:
    needs: [select, reserve-operations, execute, repair, certify, publish]
    if: always() && github.repository == 'mikevazquez/Demeter' && github.ref == 'refs/heads/chore/governance-autonomous-coordinator-20261015' && github.actor == 'mikevazquez'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROL_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coordinator-*-${{ github.run_attempt }}
          path: /tmp/coordinator-report-input
      - name: Consolidate verified results and unresolved gates
        env:
          COORDINATOR_JOBS: ${{ toJSON(needs) }}
        run: node scripts/codex-coordinator.mjs report /tmp/coordinator-report-input
      - name: Consolidate durable reservation results
        run: node scripts/governance-operations.mjs summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coordinator-report-${{ github.run_attempt }}
          path: /tmp/coordinator-report
          if-no-files-found: error
          retention-days: 14

  persist-governance:
    needs: [select, reserve-operations, execute, repair, certify, publish, report]
    if: always() && github.repository == 'mikevazquez/Demeter' && github.ref == 'refs/heads/chore/governance-autonomous-coordinator-20261015' && github.actor == 'mikevazquez'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
    outputs:
      revision: ${{ steps.record.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Persist only changed scoped observations to the shared journal
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/governance-operations.mjs record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: governance-shared-record-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/governance-shared/record.json
          if-no-files-found: error
          retention-days: 14

  recover-governance:
    needs: persist-governance
    if: always() && needs.persist-governance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Recover exact journal revision on an independent read-only runner
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ needs.persist-governance.outputs.revision }}
        run: node scripts/governance-shared.mjs recover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: governance-shared-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/governance-shared/recover.json
          if-no-files-found: error
          retention-days: 14
