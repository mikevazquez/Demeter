name: F9 format once

on:
  push:
    paths:
      - ".github/workflows/f9-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _f9_work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format F9 files
        run: npx prettier --write "app/admin/ventas/[saleId]/page.tsx" app/admin/ventas/nueva/page.tsx app/admin/ventas/page.tsx tests/f9-sales-contract.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/admin/ventas/[saleId]/page.tsx" app/admin/ventas/nueva/page.tsx app/admin/ventas/page.tsx tests/f9-sales-contract.test.ts
          git commit -m "Apply Prettier formatting for F9"
          git push origin HEAD:_f9_work
