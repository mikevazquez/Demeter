name: Format workshop branch
on:
  push:
    branches:
      - feat/talleres-saldos-configurables-uat
    paths:
      - .github/workflows/workshop-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/talleres-saldos-configurables-uat
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier settings
        run: npx prettier --write src/lib/workshops/purchase-quote.ts src/lib/workshops/purchase-quote.test.ts src/lib/workshops/checkout-plan.ts src/lib/workshops/checkout-plan.test.ts src/lib/workshops/overdue-policy.ts src/lib/workshops/overdue-policy.test.ts
      - name: Commit only formatted workshop files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/workshops/purchase-quote.ts src/lib/workshops/purchase-quote.test.ts src/lib/workshops/checkout-plan.ts src/lib/workshops/checkout-plan.test.ts src/lib/workshops/overdue-policy.ts src/lib/workshops/overdue-policy.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format workshop modules with repository Prettier"
            git push origin HEAD:feat/talleres-saldos-configurables-uat
          fi
