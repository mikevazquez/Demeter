name: Temp format rewards onboarding device steps

on:
  push:
    branches:
      - feat/rewards-bronze-onboarding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rewards-bronze-onboarding
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Rewards onboarding device files
        run: |
          npx prettier --write \
            "app/student/components/PushNotificationSettings.tsx" \
            "app/student/recompensas/OnboardingActivation.tsx" \
            "app/student/recompensas/OnboardingInstallStep.tsx" \
            "app/student/recompensas/page.tsx" \
            "app/admin/recompensas/page.tsx" \
            "app/admin/alumnas/[studentId]/page.tsx" \
            "lib/student/rewards.ts" \
            "tests/rewards-bronze-onboarding.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "app/student/components/PushNotificationSettings.tsx" \
            "app/student/recompensas/OnboardingActivation.tsx" \
            "app/student/recompensas/OnboardingInstallStep.tsx" \
            "app/student/recompensas/page.tsx" \
            "app/admin/recompensas/page.tsx" \
            "app/admin/alumnas/[studentId]/page.tsx" \
            "lib/student/rewards.ts" \
            "tests/rewards-bronze-onboarding.test.ts"
          git commit -m "chore: format Rewards onboarding device steps"
          git push origin HEAD:feat/rewards-bronze-onboarding
