name: Catalog C2 format fix

on:
  push:
    branches:
      - feat/catalogo-figuras-pole-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalogo-figuras-pole-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format catalog C1/C2 files
        run: |
          npx prettier --write \
            'app/admin/alumnas/[studentId]/StudentFiguresPanel.tsx' \
            'app/admin/alumnas/[studentId]/StudentFiguresClient.tsx' \
            'app/admin/alumnas/[studentId]/student-figures.module.css' \
            'app/admin/alumnas/[studentId]/page.tsx' \
            'app/admin/agenda/[sessionId]/PoleClassComboPanel.tsx' \
            'app/admin/agenda/[sessionId]/PoleClassComboClient.tsx' \
            'app/admin/agenda/[sessionId]/pole-class-combo.module.css' \
            'app/admin/agenda/[sessionId]/pole-actions.ts' \
            'app/admin/agenda/[sessionId]/page.tsx' \
            'app/student/actions.ts' \
            'app/student/figuras/PoleFigurePhotoPicker.tsx' \
            'app/student/figuras/page.tsx' \
            'app/student/perfil/page.tsx' \
            'tests/catalogo-c1-student-figure-progress.test.ts' \
            'tests/catalogo-c2-class-combo.test.ts'
      - name: Commit format-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "chore: format Catalog C1 C2"
          git push origin HEAD:feat/catalogo-figuras-pole-v1
