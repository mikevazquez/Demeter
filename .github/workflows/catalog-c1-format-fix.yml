name: Catalog C1 format fix

on:
  push:
    branches:
      - feat/catalogo-figuras-pole-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalogo-figuras-pole-v1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format C1 files
        run: |
          npx prettier --write \
            'app/admin/alumnas/[studentId]/Profile360Overview.tsx' \
            'app/admin/alumnas/[studentId]/student-figures.module.css' \
            'app/admin/alumnas/[studentId]/StudentFiguresClient.tsx' \
            'tests/catalogo-c1-student-figure-progress.test.ts'
      - name: Commit format-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/alumnas tests/catalogo-c1-student-figure-progress.test.ts
          git commit -m "chore: format Catalog C1"
          git push origin HEAD:feat/catalogo-figuras-pole-v1

# trigger formatter
