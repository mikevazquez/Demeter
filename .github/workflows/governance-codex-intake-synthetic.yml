name: Governance Codex Intake Synthetic CI
on:
  push:
    branches:
      - feat/governance-codex-intake-synthetic-20261015
    paths:
      - scripts/governance-codex-*.mjs
      - tests/automation/governance-codex-*.node.mjs
      - .github/workflows/governance-codex-intake-synthetic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify synthetic admission and staging without credentials
        run: node --test tests/automation/governance-codex-intake.node.mjs tests/automation/governance-codex-bridge.node.mjs tests/automation/governance-codex-stage.node.mjs
