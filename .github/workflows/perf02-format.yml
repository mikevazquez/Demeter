name: Format PERF02
on:
  push:
    branches:
      - tmp/perf02-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/perf02-prettier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/alumnas/page.tsx app/admin/inteligencia/page.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/alumnas/page.tsx app/admin/inteligencia/page.tsx
          git commit -m "style: apply prettier to PERF-02 files"
          git push origin HEAD:tmp/perf02-prettier
