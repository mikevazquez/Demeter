name: SF177 Format Current

on:
  push:
    branches:
      - feat/sf-177-walkin-commercial-pending

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/admin/page.tsx tests/sf177-walkin-commercial-pending.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx tests/sf177-walkin-commercial-pending.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(sf177): format current rebase"
          git push origin HEAD:feat/sf-177-walkin-commercial-pending
