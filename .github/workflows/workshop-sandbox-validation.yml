name: Workshop Sandbox Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workshop-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transfer-review-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Transfer review unit tests
        run: npx vitest run src/lib/workshops/transfer-review.test.ts

  workshop-quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit suite
        run: npm test
      - name: Build
        run: npm run build

  format-sandbox-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'design/workshop-payment-contract-20261016'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout isolated head
        uses: actions/checkout@v4
        with:
          ref: design/workshop-payment-contract-20261016
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply repository Prettier
        run: npx prettier --write .
      - name: Commit formatted files to isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to isolated workshop contract branch"
            git push origin HEAD:design/workshop-payment-contract-20261016
          fi
