name: Workshop Sandbox Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workshop-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transfer-review-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Transfer review unit tests
        run: npx vitest run src/lib/workshops/transfer-review.test.ts

  workshop-quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit suite
        run: npm test
      - name: Build
        run: npm run build
