name: F10 home hierarchy one-shot

on:
  push:
    branches: [f10-uat-home-hierarchy]

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f10-uat-home-hierarchy
      - name: Reorder student home hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/student/page.tsx')
          s = p.read_text()
          s = s.replace(
            '<section className="rounded-3xl border border-white/10 bg-white/[0.03] p-4 sm:p-5">',
            '<section\n        className={`${snapshot.upcoming.length ? "order-2" : "order-1"} rounded-3xl border border-white/10 bg-white/[0.03] p-4 sm:p-5`}\n      >',
            1,
          )
          old = '''      <section className="grid gap-4 xl:grid-cols-[1.4fr_0.8fr]">\n        <article className="rounded-3xl border border-white/10 bg-white/[0.03] p-5 sm:p-6">'''
          new = '''      <section\n        className={`${snapshot.upcoming.length ? "order-1" : "order-2"} rounded-3xl border border-white/10 bg-white/[0.03] p-5 sm:p-6`}\n      >'''
          if old not in s:
            raise SystemExit('agenda wrapper pattern not found')
          s = s.replace(old, new, 1)
          old2 = '''        </article>\n\n        <article className="rounded-3xl border border-white/10 bg-white/[0.03] p-5 sm:p-6">\n          <p className="text-xs font-semibold uppercase tracking-[0.2em] text-zinc-500">\n            Tu actividad\n          </p>'''
          new2 = '''      </section>\n\n      <section className="order-3 rounded-3xl border border-white/10 bg-white/[0.03] p-5 sm:p-6">\n          <p className="text-xs font-semibold uppercase tracking-[0.2em] text-zinc-500">\n            Tu actividad\n          </p>'''
          if old2 not in s:
            raise SystemExit('stats split pattern not found')
          s = s.replace(old2, new2, 1)
          old3 = '''        </article>\n      </section>\n    </main>'''
          new3 = '''      </section>\n    </main>'''
          if old3 not in s:
            raise SystemExit('stats closing pattern not found')
          s = s.replace(old3, new3, 1)
          marker = '''      <section\n        className={`${snapshot.upcoming.length ? "order-2" : "order-1"} rounded-3xl border border-white/10 bg-white/[0.03] p-4 sm:p-5`}\n      >'''
          s = s.replace(marker, '''      <div className="flex flex-col gap-6">\n''' + marker, 1)
          end_marker = '''      </section>\n    </main>'''
          s = s.replace(end_marker, '''      </section>\n      </div>\n    </main>''', 1)
          p.write_text(s)
          PY
          npx prettier --write app/student/page.tsx
          rm .github/workflows/f10-home-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/student/page.tsx .github/workflows/f10-home-order.yml
          git commit -m "fix(f10): prioritize booked classes on student home"
          git push origin HEAD:f10-uat-home-hierarchy
