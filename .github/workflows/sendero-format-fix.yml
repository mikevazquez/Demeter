name: Sendero format fix

on:
  push:
    branches:
      - feat/sendero-visual-system

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sendero-visual-system
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format Sendero files
        run: |
          npx prettier --write \
            app/globals.css \
            app/student/documentos/page.tsx \
            app/student/evaluaciones/[invitationId]/programar/page.tsx \
            app/student/evaluaciones/page.tsx \
            app/student/evaluaciones/resultado/[evaluationId]/page.tsx \
            app/student/layout.tsx \
            app/student/mis-clases/page.tsx \
            app/student/movimientos/page.tsx \
            app/student/page.tsx \
            app/student/paquete/page.tsx \
            app/student/perfil/page.tsx \
            app/student/recompensas/medallero/page.tsx \
            app/student/recompensas/page.tsx \
            app/student/reservar/page.tsx \
            app/student/reservar/quick-book-button.tsx \
            tests/sendero-visual-system.test.ts

      - name: Commit format-only changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css app/student tests/sendero-visual-system.test.ts
          git commit -m "chore: format Sendero visual system"
          git push origin HEAD:feat/sendero-visual-system
