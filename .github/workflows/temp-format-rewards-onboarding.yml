name: Temp format rewards onboarding

on:
  push:
    branches:
      - feat/rewards-bronze-onboarding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rewards-bronze-onboarding
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed Rewards onboarding files
        run: |
          npx prettier --write             "app/admin/alumnas/[studentId]/page.tsx"             "app/admin/recompensas/page.tsx"             "app/student/perfil/page.tsx"             "app/student/recompensas/OnboardingActivation.tsx"             "tests/rewards-bronze-onboarding.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "app/admin/alumnas/[studentId]/page.tsx"             "app/admin/recompensas/page.tsx"             "app/student/perfil/page.tsx"             "app/student/recompensas/OnboardingActivation.tsx"             "tests/rewards-bronze-onboarding.test.ts"
          git commit -m "chore: format Rewards onboarding"
          git push origin HEAD:feat/rewards-bronze-onboarding
