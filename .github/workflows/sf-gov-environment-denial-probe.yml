name: SF GOV environment denial probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sf-gov-environment-denial-probe.yml"

permissions: {}

jobs:
  must-not-start-from-pr:
    if: github.event.pull_request.number == 278
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment:
      name: sf-gov-schema-capture
    steps:
      - name: Unexpected environment access
        run: |
          echo "::error::NEGATIVE_PROBE_UNEXPECTED_ACCESS: PR reached protected environment"
          exit 1
