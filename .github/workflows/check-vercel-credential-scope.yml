name: Check Vercel Credential Scope

on:
  push:
    branches:
      - "feat/rewards-bronze-onboarding"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credential scope
        shell: bash
        env:
          SECRET_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VARIABLE_TOKEN: ${{ vars.VERCEL_TOKEN }}
        run: |
          if [ -n "$SECRET_TOKEN" ]; then echo "repository_secret=present"; else echo "repository_secret=missing"; fi
          if [ -n "$VARIABLE_TOKEN" ]; then echo "repository_variable=present"; else echo "repository_variable=missing"; fi
