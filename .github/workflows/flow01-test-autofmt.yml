name: Flow 01 test autofmt

on:
  push:
    branches:
      - feat/flow-01-alta-completa-alumna
    paths:
      - ".github/workflows/flow01-test-autofmt.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-01-alta-completa-alumna
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'tests/flow01-student-onboarding-contract.test.ts'
      - run: git rm .github/workflows/flow01-test-autofmt.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: format Flow 01 contract test"
          git push origin HEAD:feat/flow-01-alta-completa-alumna
