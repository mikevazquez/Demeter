name: Format Debug

on:
  pull_request:

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files
        run: |
          npx prettier --write app/admin/automatizaciones/actions.ts app/admin/automatizaciones/[code]/page.tsx
          echo "===== ACTIONS_FORMATTED_START ====="
          cat app/admin/automatizaciones/actions.ts
          echo "===== ACTIONS_FORMATTED_END ====="
          echo "===== DETAIL_FORMATTED_START ====="
          cat app/admin/automatizaciones/[code]/page.tsx
          echo "===== DETAIL_FORMATTED_END ====="
