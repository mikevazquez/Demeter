name: Format debug

on:
  push:
    branches:
      - feat/sf-n14-portal-ux02-home

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target and print diff
        run: |
          npx prettier app/student/page.tsx --write
          git diff -- app/student/page.tsx
