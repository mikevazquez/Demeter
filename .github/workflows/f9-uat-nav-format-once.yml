name: F9 UAT navigation format once

on:
  push:
    paths:
      - ".github/workflows/f9-uat-nav-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9-uat-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format Empresa page
        run: npx prettier --write app/admin/empresa/page.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/empresa/page.tsx
          git commit -m "Format Empresa navigation hub"
          git push origin HEAD:f9-uat-navigation
