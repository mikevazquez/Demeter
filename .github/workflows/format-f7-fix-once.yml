name: Format F7 fix once

on:
  push:
    paths:
      - ".github/workflows/format-f7-fix-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/agenda/[sessionId]/page.tsx"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "app/admin/agenda/[sessionId]/page.tsx"
          git diff --cached --quiet || git commit -m "Format F7 reservation detail"
          git push
