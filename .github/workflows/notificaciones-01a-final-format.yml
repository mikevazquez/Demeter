name: NOTIFICACIONES-01A final formatter

on:
  push:
    branches: [feat/notificaciones-01a-pwa-push]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notificaciones-01a-pwa-push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format touched files
        run: |
          npx prettier --write \
            app/student/components/PushNotificationSettings.tsx \
            app/student/layout.tsx \
            lib/env.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/student/components/PushNotificationSettings.tsx app/student/layout.tsx lib/env.ts
          git commit -m "NOTIFICACIONES-01A · Aplicar formato final"
          git push origin HEAD:feat/notificaciones-01a-pwa-push
