name: Preview Medals UAT

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-medals-uat
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_CcrutxzcE3pkpRf2Cj9gjcLh
      VERCEL_PROJECT_ID: prj_AdAFmk2E7tQX6nuhLJT8LHRoI8W6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel credential exists
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Preview
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --yes --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Studio Flow · Medals UAT Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm Preview only
        shell: bash
        run: |
          echo "Preview deployed: ${{ steps.deploy.outputs.url }}"
          echo "No production promotion was requested or executed."
