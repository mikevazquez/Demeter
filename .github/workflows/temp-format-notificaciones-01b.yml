name: Temp format NOTIFICACIONES-01B

on:
  push:
    branches:
      - feat/notificaciones-01b-engine

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notificaciones-01b-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write supabase/functions/notification-engine-worker/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/notification-engine-worker/index.ts
          git commit -m "NOTIFICACIONES-01B · Formatear worker"
          git push origin HEAD:feat/notificaciones-01b-engine
