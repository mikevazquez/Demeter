name: INTEL-13 Sandbox Preview

on:
  push:
    branches:
      - feat/inteligencia-13-decision-intelligence
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: intel-13-sandbox-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_CcrutxzcE3pkpRf2Cj9gjcLh
      VERCEL_PROJECT_ID: prj_AdAFmk2E7tQX6nuhLJT8LHRoI8W6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout INTEL-13
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Sandbox preview
        id: deploy
        shell: bash
        run: |
          URL="$(vercel deploy --yes --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL=https://hedouonyhynuvwbckdlg.supabase.co \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_pXzsmytzghwW-3QhLg11Qg_BFZT_kuW \
            --env NEXT_PUBLIC_SUPABASE_URL=https://hedouonyhynuvwbckdlg.supabase.co \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_pXzsmytzghwW-3QhLg11Qg_BFZT_kuW)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview URL on commit
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -n --arg url "$PREVIEW_URL" '{
              state: "success",
              target_url: $url,
              description: "INTEL-13 using Studio Flow Sandbox",
              context: "INTEL-13 Sandbox Preview"
            }')"

      - name: Confirm no production promotion
        run: |
          echo "Sandbox: hedouonyhynuvwbckdlg"
          echo "Production was not modified."
