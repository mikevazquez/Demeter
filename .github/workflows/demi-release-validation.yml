name: Demi release validation

on:
  push:
    branches:
      - release/demi-production-candidate
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: demi-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Demi and Asistian regression tests
        run: >
          npx vitest run
          tests/demi-*.test.ts
          tests/sf173-messaging-provider.test.ts
          tests/sf174-asistian-provider.test.ts
          tests/sf174-reservation-cancelled-asistian.test.ts
          tests/sf174-waitlist-promoted-asistian.test.ts
          tests/sf174-student-welcome.test.ts

      - name: Build
        run: npm run build
