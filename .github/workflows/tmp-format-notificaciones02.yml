name: Temporary Prettier Fix NOTIFICACIONES-02

on:
  push:
    branches:
      - feat/notificaciones-02-control-center

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format NOTIFICACIONES-02')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notificaciones-02-control-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "studio-flow-bot"
          git config user.email "studio-flow-bot@users.noreply.github.com"
          git add app/admin/layout.tsx app/admin/notificaciones lib/notifications tests/admin-ux-02-navigation.test.ts tests/notificaciones02-control-center.test.ts
          git commit -m "chore: format NOTIFICACIONES-02"
          git push origin HEAD:feat/notificaciones-02-control-center
