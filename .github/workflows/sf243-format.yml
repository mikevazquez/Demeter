name: SF243 temporary formatter

on:
  push:
    branches:
      - feat/sf-243-rewards-incidents

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sf-243-rewards-incidents

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format SF-243
        run: npx prettier --write app/admin/recompensas lib/rewards/incidents.ts tests/sf243-rewards-incidents.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- app/admin/recompensas lib/rewards/incidents.ts tests/sf243-rewards-incidents.test.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/recompensas lib/rewards/incidents.ts tests/sf243-rewards-incidents.test.ts
          git commit -m "style: format SF-243 rewards incidents"
          git push origin HEAD:feat/sf-243-rewards-incidents
