name: Documents consent test format helper

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/documentos-consent-exception.test.ts"
      - ".github/workflows/documents-consent-test-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "tests/documentos-consent-exception.test.ts"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "studio-flow-ci"
          git config user.email "studio-flow-ci@users.noreply.github.com"
          git add "tests/documentos-consent-exception.test.ts"
          git commit -m "chore(documents): format consent regression test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
