name: Temporary Prettier Fix NOTIFICACIONES-02 Actions

on:
  push:
    branches:
      - feat/notificaciones-02-control-center

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: prettier notification actions')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notificaciones-02-control-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write "app/admin/notificaciones/actions.ts"
      - name: Commit formatted file
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "studio-flow-bot"
          git config user.email "studio-flow-bot@users.noreply.github.com"
          git add "app/admin/notificaciones/actions.ts"
          git commit -m "chore: prettier notification actions"
          git push origin HEAD:feat/notificaciones-02-control-center
