name: PWA branding formatter

on:
  push:
    branches: [feat/notificaciones-01a-pwa-push]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notificaciones-01a-pwa-push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'app/pwa/studio-icon/[size]/route.ts'
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/pwa/studio-icon/[size]/route.ts'
          git commit -m "NOTIFICACIONES-01A · Formatear icono PWA dinámico"
          git push origin HEAD:feat/notificaciones-01a-pwa-push
