name: Format 01D Temp

on:
  push:
    branches:
      - feat/notificaciones-01d-p0-rules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write supabase/functions/_shared/notification-asistian-variables.ts supabase/functions/notification-delivery-worker/index.ts supabase/functions/notification-engine-worker/index.ts
      - name: Show formatting diff
        run: git diff -- supabase/functions/_shared/notification-asistian-variables.ts supabase/functions/notification-delivery-worker/index.ts supabase/functions/notification-engine-worker/index.ts
