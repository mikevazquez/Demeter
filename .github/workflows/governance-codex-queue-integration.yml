name: Governance Codex Queue Integration CI
on:
  push:
    branches:
      - feat/governance-codex-queue-integration-20261015
    paths:
      - scripts/governance-codex-*.mjs
      - scripts/codex-coordinator.mjs
      - tests/automation/governance-codex-queue-integration.node.mjs
      - tests/automation/coordinator.node.mjs
      - .github/workflows/governance-codex-coordinator.yml
      - .github/workflows/governance-codex-queue-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate integration without credentials or queue mutations
        run: |
          node --test tests/automation/governance-codex-queue-integration.node.mjs
          node --test tests/automation/coordinator.node.mjs
