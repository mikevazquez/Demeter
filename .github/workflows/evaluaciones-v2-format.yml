name: EVALUACIONES v2 format helper # final

on:
  push:
    branches:
      - feat/evaluaciones-01-sync
    paths:
      - ".github/workflows/evaluaciones-v2-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evaluaciones-01-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format EVALUACIONES v2 files
        run: |
          npx prettier --write \
            "app/admin/alumnas/[studentId]/StudentEvaluationsPanel.tsx" \
            "app/admin/evaluaciones/[id]/page.tsx" \
            "app/admin/evaluaciones/disciplina/[disciplineId]/page.tsx" \
            "app/admin/evaluaciones/EvaluationLiveFormV2.tsx" \
            "app/admin/evaluaciones/v2-actions.ts" \
            "app/admin/evaluaciones/v2/[id]/page.tsx" \
            "app/admin/evaluaciones/evaluaciones.css"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "studio-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "app/admin/alumnas/[studentId]/StudentEvaluationsPanel.tsx" \
            "app/admin/evaluaciones/[id]/page.tsx" \
            "app/admin/evaluaciones/disciplina/[disciplineId]/page.tsx" \
            "app/admin/evaluaciones/EvaluationLiveFormV2.tsx" \
            "app/admin/evaluaciones/v2-actions.ts" \
            "app/admin/evaluaciones/v2/[id]/page.tsx" \
            "app/admin/evaluaciones/evaluaciones.css"
          git commit -m "style: format evaluations v2 [skip ci]"
          git push origin HEAD:feat/evaluaciones-01-sync
