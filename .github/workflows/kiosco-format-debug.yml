name: KIOSCO format debug

on:
  push:
    branches:
      - release/kiosco-01-approved

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write app/admin/hoy/ExistingStudentAddForm.tsx app/admin/hoy/SessionOperations.tsx
          git diff -- app/admin/hoy/ExistingStudentAddForm.tsx app/admin/hoy/SessionOperations.tsx
