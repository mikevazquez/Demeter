name: Catalog Prototype Formatter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalogo-figuras-pole-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'app/admin/agenda/[sessionId]/pole-class-combo.module.css' 'app/admin/agenda/[sessionId]/PoleClassComboClient.tsx' 'app/admin/agenda/[sessionId]/PoleClassComboPanel.tsx' 'app/student/figuras/page.tsx' 'tests/catalogo-c2-class-combo.test.ts'
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore: format prototype Pole flow'
          branch: feat/catalogo-figuras-pole-v1
